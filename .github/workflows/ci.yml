name: ci

# PULL REQUESTS ONLY. A push-to-main trigger would re-run the same suite on a commit
# that is, in the ordinary case, identical in content to the one just verified: the
# ruleset requires a branch to be up to date with main before it can merge. On a
# pull_request event, the default checkout tests GitHub's synthetic merge of the
# PR head into its base, with checks reported against that PR head. Paying for a
# second run bought a signal on main itself, and nothing here reads that signal —
# no badge, no downstream workflow, no deployment gate keys off it.
#
# What this gives up, stated plainly: a squash merge creates a new commit that no
# PR run has tested verbatim. The tested merge tree and squash tree normally agree
# under the strict up-to-date rule, but this workflow does not test the final SHA
# or independently compare its package bytes. If main ever does break, this CI
# trigger will not be what tells you.
on:
  # labeled/unlabeled: the tamperward gate reads its out-of-band sign-off from the PR's
  # labels via the EVENT PAYLOAD, and a re-run reuses the original payload — so a label
  # applied after the run could never be seen by re-running. Labeling re-evaluates the
  # gate; so does UN-labeling, because revoking a sign-off must re-block, not linger
  # green until the next push.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Least privilege: this pipeline reads the repo and runs tests. Nothing in it needs a
# write-scoped token, and a security tool should not model bad habits in its own CI.
# pull-requests: read exists for exactly one step — the session-link screen reads the
# PR body LIVE from the API, because the event payload snapshots the body at trigger
# time: a body edited after the triggering push would be judged stale in both
# directions (a cleanup invisible, and worse, a late-added link unseen).
permissions:
  contents: read
  pull-requests: read

# A superseded push should stop burning a runner, and two runs racing on one ref can
# report out of order — which matters when a required check gates the merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Do the TYPES check? Runs once: types do not vary by Node version, so putting this in
  # the matrix paid for the same answer three times.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Is the CODE correct, on every Node the package claims to support?
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines >=20.19 (2.0.0 dropped Node 18, which is past
        # end of life and which the dev toolchain no longer runs on). Every leg here
        # is a version the package claims to support, so the floor is a tested claim.
        # Keep the required check context test (20) stable while pinning its
        # actual runtime to the declared 20.19 engine floor.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The schema-identifier test dereferences an earlier release tag when a schema's
      # bytes have not changed since it (#662). The depth-1 checkout carries no tags,
      # and `fetch-tags: true` only auto-follows tags that point at the fetched commit,
      # so fetch every release tag shallowly (a few MB) rather than the full history.
      - name: Fetch release tags
        run: git fetch --no-tags --depth=1 origin '+refs/tags/v*:refs/tags/v*'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node == 20 && '20.19' || matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # PACKAGE COMPATIBILITY ONLY. The harness selftests and the static checks used
      # to run here, on every Node leg. They are slow and Node-version-INDEPENDENT,
      # and they pushed this job past its 10-minute budget: legs finished at 9m27s
      # and 10m00s with one CANCELLED at 10m15s, taking `gate` down as skipped with
      # it. They now run once each, on the protocol-pinned Node 22, in `harness-core`
      # and `round4-harness`.

  # The performance smoke, ALONE on its runner (#421). harness/perf/smoke.test.ts
  # judges the cheapest harness/perf items as CPU ratios to a parser-loading
  # yardstick measured in the same run; inside the parallel `npm test` matrix the
  # sibling test files, not regressions, spent its headroom, and a load-induced red
  # took `gate` down with it. `npm test` excludes `**/harness/**`, so this is the
  # only place the smoke runs on a PR; it is still on every supported Node, because
  # the point of the smoke is that the suite runs end to end wherever the package
  # claims to. Absolute numbers stay the nightly `perf` workflow's business.
  perf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:perf-smoke

  # Platform contract. This is deliberately a narrow real-host matrix rather than
  # running the whole Linux-centric adversarial suite on every OS. It proves the
  # support boundary itself on the hosts we document: POSIX local-verifier shell
  # selection on Linux/macOS, explicit Windows local-verify refusal before candidate
  # execution, and Linux-only authoritative run lifecycle classification.
  platform-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run test/platform-support.test.ts

  # Round-4 orchestration and the pilot-task verifier. Previously validated only by
  # hand, so green CI said nothing about them — and the verifier decides whether a
  # mined task is usable at all, which makes an unnoticed regression in it a route
  # for an unusable task to enter the pilot.
  #
  # Its OWN job, deliberately, for two reasons. It is independent of the Node
  # version, so running it on all three matrix legs would be three times the cost
  # for one answer. And the `test` job is already at its 10-minute budget — legs
  # finished at 9m27s, 10m00s and one CANCELLED at 10m15s — so adding anything to
  # it would convert a marginal job into a reliably failing one.
  # The research harness, on the protocol-pinned Node 22. Split from `test` because
  # these are Node-version-independent — running them across the matrix paid three
  # times for one answer and blew that job's budget.
  #
  # No `npm ci`: every one of these scripts uses only node built-ins (fs, crypto,
  # child_process) plus fixture-local sources, so installing the package's
  # dependencies bought nothing but runtime. Verified by inspecting every import in
  # the selftests and the .mjs helpers they call.
  harness-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The miner under a RANDOMIZED work root: a literal /tmp/tb-mine inside a node
      # heredoc survived round 1 (default == literal) and broke round 2's walk. This
      # selftest mines a local fixture, proves the exact round-trip, and fails if
      # anything touches the default path — the class cannot come back silently.
      - run: bash harness/taskbench/miner-selftest.sh
      # Round-3.1 execution hygiene. The registration gate, the resumability
      # semantics (terminal vs retryable), the circuit breaker's blast radius and the
      # attempt provenance are proved BEHAVIOURALLY against a stubbed sweep — the
      # round-3 outage burned 7 pairs because that logic was only ever exercised by
      # an emergency script.
      - run: bash harness/taskbench/runner/hygiene-selftest.sh
      # Static half of the same guard: any /tmp/tb-mine literal in a miner must be on
      # a line that derives from TB_WORK; a naked literal is the regression.
      - name: no naked default-workdir literals in miners
        run: |
          bad=$(grep -n '/tmp/tb-mine' harness/taskbench/mine.sh harness/taskbench/round2/mine.sh | grep -vE ':[0-9]+:\s*(#|//)' | grep -v 'TB_WORK' || true)
          if [ -n "$bad" ]; then echo "naked /tmp/tb-mine literal:"; echo "$bad"; exit 1; fi

  # Round-4 orchestration and the pilot-task verifier. The verifier decides whether a
  # mined task is usable at all, so an unnoticed regression in it is a route for an
  # unusable task to enter the pilot.
  round4-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # FULL history. The pilot manifest records the commit it was frozen against,
      # and `--check` asserts that commit is an ancestor of HEAD. A default shallow
      # checkout does not contain it, so the question is unanswerable rather than
      # answered — the check reports that honestly now, but reporting "unverifiable"
      # on every CI run would quietly retire a provenance check that costs one fetch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # `uv` is what the frozen install ladder uses, and the parent-green control
      # builds a local fixture repository and runs its suite, so it is required here
      # rather than optional. Pinned: the manifests record the uv the tasks were
      # mined with.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.8.17'
      - run: bash harness/taskbench/round4/selftest.sh
      # The results analyzer's FAIL-CLOSED completeness gate: an incomplete or inconsistent
      # census must never be sealed — analyze-counted.mjs refuses to write an artifact and
      # exits non-zero (a completeness_ok:false field inside a sealed artifact is NOT enough,
      # since downstream automation can treat exit 0 + a seal as authoritative). Synthetic
      # fixture; no state, network, or credential. (PR #297 review.)
      - run: bash harness/taskbench/round4/analyze-counted.selftest.sh
      # The step-6 revocation verdict logic, stubbed. The real check is manual and
      # runs once, against a credential that by then is expected to be dead —
      # the worst moment to discover it accepts something it should not, since a
      # false REVOKED would close the registered credential step on evidence that
      # does not hold. Deterministic: no network, no agent CLI, no credential.
      # The adjudicator's own outcome logic, incl. the shared-classifier proof: a
      # non-measurement (126/127/signal/collection/timeout) is INVALID_MEASUREMENT,
      # never MASKED_FAILURE, in both arms and both positions, and measured:false so
      # no denominator can count it. Fake-hook driven — no venv, no network.
      - run: bash harness/taskbench/runner/verdict4-selftest.sh
      # Agent EXECUTION validity — the positive contract that a task outcome may
      # count ONLY on proof of a genuine model completion. The <synthetic> auth-error
      # turn that recorded a bogus NOT_FIXED at pilot seq 1 is a fixture here, and
      # must classify as NOT_EXECUTED, alongside a real completion (incl. torn stream)
      # as EXECUTED. Deterministic: no network, no agent CLI, no credential.
      - run: bash harness/taskbench/runner/agent-exec-contract.selftest.sh
      # The non-consuming credential preflight: proves it passes ONLY on a genuine
      # completion, ignores a CLI that exits 0 on a synthetic api_error, and creates
      # NO trajectory state. CLI stubbed via TB_PREFLIGHT_CLI — no network.
      - run: bash harness/taskbench/runner/preflight-auth.selftest.sh
      # Editable-install LIVENESS primitive — the ONE check (shared by run-task4's
      # PRE_AGENT guard and the pre-freeze pool checker) that a source edit the agent
      # makes in the repo is LIVE for the suite. Proves it by construction (mutate,
      # fresh import, observe, restore); the iteration-2 task-04 finder-hook shape must
      # read LIVE and a frozen shadow copy NOT_VERIFIED. Uses python venv + pip.
      - run: bash harness/taskbench/runner/editable-liveness.selftest.sh
      - run: bash harness/taskbench/runner/gated-base-wiring.selftest.sh
      - run: bash harness/taskbench/round4/verify-revocation-selftest.sh
      # The pilot ITERATION LIFECYCLE. Its whole job is to stop "no iteration is
      # frozen" from reading as "anything may run", so the interesting failure is
      # the permissive answer reached for the wrong reason — a malformed record, a
      # missing field, a manifest edited after its iteration closed. Deterministic:
      # no artefact, no network, no credential, no trajectory.
      - run: bash harness/taskbench/round4/pilot-lifecycle-selftest.sh
      # The pilot registration must keep describing the tree it registers. A PR
      # that edits the adjudicator, the runner, a task patch or the pool without
      # re-freezing fails here rather than at trajectory one.
      #
      # The two flags are what CI can honestly assert and no more: no artefact is
      # deployed on a runner, and the runner's own environment necessarily
      # differs from the freeze host, so comparing either would make this step
      # fail for reasons that mean nothing. Binding drift — the identities that
      # shape the measurement — is checked in full.
      - name: the frozen pilot manifest still describes this tree
        env:
          TB_PILOT_CHECK_NO_ARTEFACT: '1'
          TB_PILOT_CHECK_BINDING_ONLY: '1'
        # Exit 6 is "no iteration is registered" — the state between a closed
        # iteration and the next freeze, where the tree is SUPPOSED to differ
        # from a manifest that describes what already ran. Accepted here and
        # nowhere that runs a trajectory: pilot-drive.sh refuses on it, because
        # it refuses on every code it does not recognise.
        run: |
          node harness/taskbench/round4/freeze-pilot-manifest.mjs --check || {
            rc=$?; [ "$rc" = 6 ] || exit "$rc"
            echo "no pilot iteration is registered — no freeze claim is made about this tree"
          }

  # Structural verifier isolation: this is the #341 threat control, not a unit
  # approximation. It first proves the same-host/checkpointed backend can be
  # fooled by a dependency substitute that restores every byte/mode before the
  # checkpoint, then proves the isolated backend cannot mutate its image-owned
  # dependency at all.
  verifier-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Immutable multi-platform Node 22 Alpine index. The product itself never
      # pulls during adjudication (--pull never); trusted provisioning happens
      # here, before the threat control starts.
      - name: Provision pinned verifier base image
        run: docker pull node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
      - name: Isolated verifier end-to-end threat control
        env:
          TAMPERWARD_CONTAINER_E2E: '1'
          TAMPERWARD_CONTAINER_ENGINE: docker
        run: npx vitest run test/verifier-container-e2e.test.ts

  # Is the ARTIFACT sound? Distinct question from "is the code correct", and it has its
  # own failure mode: `files: [dist]` with dist/ gitignored once shipped a tarball
  # containing no binary at all. Nothing in CI installed what npm would actually publish,
  # so nothing caught it.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # This e2e owns the built artifact. The Node compatibility matrix does not
      # build dist/ and may run tests that create/remove scratch build output.
      - name: Built hook-service CLI e2e
        run: TAMPERWARD_BUILT_CLI_E2E=1 npx vitest run test/hook-service.test.ts -t "built CLI end to end"

      # #517: the outer-process reconstruction-bound smoke is gated on a built dist/, which the
      # test matrix never produces, so it silently skips there. Run it here, where `npm run build`
      # just wrote dist/, so green CI actually proves the built hook denies an over-budget write
      # and exits within a hard SIGKILL maximum instead of stalling.
      - name: PreToolUse reconstruction bound — built-hook outer-process smoke (#517)
        run: npx vitest run test/synth-reconstruct-bound-517.test.ts

      # The site used to build only on push to main, so a page that broke the
      # Vue template compile (2.6.0's rules row) merged and took the deploy down.
      # Dead links fail it too (`ignoreDeadLinks: false`).
      - name: Build the docs site
        run: npx vitepress build docs
      - name: Smoke-test the rendered site
        run: node .github/docs/docs-smoke.mjs docs/.vitepress/dist

      - name: Smoke-test the published artifact
        run: |
          set -euo pipefail
          TGZ="$(npm pack --silent)"
          WORK="$(mktemp -d)"
          cd "$WORK" && npm init -qy >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$TGZ" >/dev/null
          FIRST="$(./node_modules/.bin/tamperward 2>&1 | head -1)"
          echo "installed CLI says: $FIRST"
          case "$FIRST" in
            tamperward*) echo "artifact OK — bin resolves, is executable, and runs" ;;
            *) echo "published artifact is broken"; exit 1 ;;
          esac

  # Can a runner actually provision the pilot? The toolchain, the artefact deploy + pin,
  # the network jail and the freeze — validated on every push/PR through the SAME
  # provision-check.sh the `pilot` workflow runs, so a runner-image / package / action
  # regression (e.g. python3.11 leaving noble's apt) fails here rather than being
  # discovered on a manual `pilot` dispatch. Runs NO trajectory and needs no credential.
  # The setup steps mirror .github/workflows/pilot.yml and must stay in step with it.
  pilot-provisioning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.8.17'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nftables iproute2 jq
      - run: npm ci
      - run: npm run build
      - run: bash harness/taskbench/round4/provision-check.sh

  # Does the CHANGE violate the integrity policy? The dogfood job: Tamperward gates its
  # own repo with the engine it ships. Rebuilds rather than passing an artifact around —
  # the bundle takes milliseconds and the CLI needs its runtime deps installed anyway.
  gate:
    # `needs` alone is NOT enough to make a check required. Without `if: always()` a
    # failing dependency SKIPS this job, and a skipped required check can be treated
    # as satisfied — so a red harness job could sit beside a mergeable gate. The job
    # therefore always runs and asserts every dependency's result explicitly.
    # Belt and braces: harness-core and round4-harness should ALSO be listed in the
    # repository's required-status ruleset, so the protection survives an edit to
    # this file.
    if: ${{ always() }}
    needs: [typecheck, test, perf-smoke, build, platform-contract, harness-core, round4-harness, pilot-provisioning, verifier-container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: every dependency must have succeeded
        env:
          RESULTS: >-
            typecheck=${{ needs.typecheck.result }}
            test=${{ needs.test.result }}
            perf-smoke=${{ needs.perf-smoke.result }}
            build=${{ needs.build.result }}
            platform-contract=${{ needs.platform-contract.result }}
            harness-core=${{ needs.harness-core.result }}
            round4-harness=${{ needs.round4-harness.result }}
            pilot-provisioning=${{ needs.pilot-provisioning.result }}
            verifier-container=${{ needs.verifier-container.result }}
        run: |
          echo "$RESULTS"
          bad=$(printf '%s\n' $RESULTS | grep -v '=success$' || true)
          if [ -n "$bad" ]; then
            echo "REFUSING: a dependency did not succeed:" >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the range diff has both endpoints
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # SPEC §5.4: in CI a sign-off must be OUT OF BAND — never a file the same PR can
      # commit, because then the change being blocked could authorise itself. The channel
      # is a compact PR label `tw1:<digest>` (or legacy `tamperward:allow:<rule>@<head-sha>`), which only someone with triage
      # access or higher can apply (label permission is approval permission), further gated by branch protection + CODEOWNERS. Both forms
      # bind the approval to the commit it was granted for: labels persist across
      # pushes, and this gate ran without TAMPERWARD_OOB_HEAD until 1.14.7 — so an
      # unbound label earned for one benign finding cleared every later one pushed to
      # the same PR, the P1-6 hole the shipped template had already closed.
      #
      # Label text is user-controlled, so it is passed through env and parsed with jq —
      # never interpolated into the shell, which would be a command-injection hole in the
      # one workflow that must not have one.
      # CLAUDE.md's standing rule is "No agent attribution, ever" on every public
      # surface. This job is the MECHANICAL half of that rule, and only for the surfaces
      # a pull_request run can see — the PR body, the range's commit messages, and the
      # diff. It is NOT an all-surfaces guarantee: issue_comment and
      # pull_request_review_comment bodies are invisible to this job, so keeping those
      # clean stays an agent/process rule, not something this gate enforces.
      # What it screens: the PR body, every commit message in the range, and every added
      # line of the diff are screened for a Claude session URL; a hit fails the
      # (required) gate. The PR body AND every commit message are ALSO screened for an
      # attribution footer — a Co-Authored-By naming an assistant, a "Generated with/by
      # [Claude Code]" / "Built using Claude" line, or a Claude-Session: trailer. The
      # GitHub connector force-appends such a footer to a PR *body* at creation; it must
      # be stripped, NOT left in place — the gate reads the live body, so a
      # create-then-strip clears it. The diff screen stays session-link-only on purpose:
      # committed run transcripts legitimately contain captured agent output, and this
      # gate's own error strings below contain the attribution phrases as data, so
      # screening added lines for them would false-positive on both (the policy's own
      # `ignore` excludes harness/** for the same reason). Untrusted PR text goes through
      # env, never shell interpolation, same as the label step.
      - name: No session links or agent attribution in PR body, commits, or diff
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
          FALLBACK_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PAT='claude\.ai/code/session'
          # Agent-attribution footers that must not reach a mutable public surface (the
          # PR body) or permanent git history (commit messages). Precise emitted forms,
          # so text that merely documents the ban in prose (slash-joined "with/by", a
          # backtick'd `Co-Authored-By`) is not caught.
          ATTR='Claude-Session:|Co-Authored-By:.*([Cc]laude|[Aa]nthropic)|[Gg]enerated (with|by) \[?[Cc]laude|[Bb]uilt using [Cc]laude'
          # Live body, not the event payload: the payload snapshots the body at
          # trigger time, so a post-push edit — removing a link, or adding one —
          # would be judged stale. Payload is the fallback if the API read fails.
          PR_BODY="$(curl -sf -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$API" | jq -r '.body // ""' || printf '%s' "$FALLBACK_BODY")"
          fail=0
          if printf '%s' "$PR_BODY" | grep -Eq "$PAT"; then
            echo "::error::PR description contains a Claude session link — remove it."
            fail=1
          fi
          if printf '%s' "$PR_BODY" | grep -Eq "$ATTR"; then
            echo "::error::PR description contains an agent-attribution footer (Generated-with/by Claude Code, Built-using-Claude, Co-Authored-By an assistant, or a Claude-Session trailer) — strip it from the body."
            fail=1
          fi
          # Materialise each text first, then grep it. Under `pipefail`, `grep -q`
          # exits on the first match and the producer upstream dies of SIGPIPE when
          # more than a pipe buffer of text follows, so the pipeline fails and the
          # `if` reads that as "no match" — a link early in a large diff was missed.
          # `|| true` on the producers: an empty result is a clean result, not an error.
          COMMITS="$(git log --format=%B "$PR_BASE..$PR_HEAD" || true)"
          if printf '%s' "$COMMITS" | grep -Eq "$PAT"; then
            echo "::error::A commit message in this PR contains a Claude session link — reword it."
            fail=1
          fi
          if printf '%s' "$COMMITS" | grep -Eq "$ATTR"; then
            echo "::error::A commit message in this PR carries agent attribution (Co-Authored-By naming an assistant, a Generated-with/by [Claude Code] line, or a Claude-Session trailer) — reword it."
            fail=1
          fi
          ADDED="$(git diff "$PR_BASE...$PR_HEAD" | grep -E '^\+' || true)"
          if printf '%s' "$ADDED" | grep -Eq "$PAT"; then
            echo "::error::A file change in this PR adds a Claude session link — remove it."
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "clean: no session links (body/commits/diff) and no agent attribution (body/commits)"
          exit "$fail"

      # CLAUDE.md's release rule — "every behaviour change ships with its bump ... never
      # leave an [Unreleased] section behind" — had no mechanical half: five behaviour
      # changes merged on 2026-09-26 without a bump and main shipped unreleased behaviour
      # under the previous tag (#691). This step is that half for the surfaces a
      # pull_request run can see (#693): a change under src/ or schemas/ (the published
      # surface) must move package.json's version forward, with a dated
      # "## [<version>] — YYYY-MM-DD" heading as the newest CHANGELOG entry and the lock
      # file in step; an [Unreleased] heading fails outright. A change that ships no
      # behaviour is recorded, not waved through: a maintainer applies the label
      # `release-none:<head-sha prefix>` — bound to the exact head, like `tw1:`, so a label
      # earned for one push does not clear the next. SHAs and label text go through env,
      # never shell interpolation. Helper unit-tested in test/release-discipline.test.ts.
      - name: Shipped code moves the version (release discipline)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node .github/scripts/release-discipline.mjs "$PR_BASE" "$PR_HEAD"

      - name: Resolve out-of-band sign-off from PR labels
        id: oob
        if: github.event_name == 'pull_request'
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          RULES="$(printf '%s' "$LABELS" | jq -r '.[] | if startswith("tamperward:allow:") then sub("^tamperward:allow:"; "") elif startswith("tw1:") then . else empty end' | paste -sd, -)"
          echo "rules=$RULES" >> "$GITHUB_OUTPUT"
          [ -n "$RULES" ] && echo "out-of-band approval present for: $RULES" || echo "no out-of-band approval on this PR"

      - name: Tamperward self-gate
        env:
          TAMPERWARD_OOB_SIGNOFF: ${{ steps.oob.outputs.rules }}
          TAMPERWARD_OOB_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE...$PR_HEAD"
          else
            # A force-push leaves `before` pointing at a commit that no longer exists.
            # Using it unchecked yields an empty range — a gate that passes by accident,
            # which is the failure mode this whole project exists to prevent.
            if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              if ! git rev-parse --verify --quiet "${PUSH_HEAD}^" >/dev/null; then
                echo "root commit and no usable before-sha; nothing to range-check."
                exit 0
              fi
              echo "before-sha unusable (new branch or force-push); falling back to the last commit."
              PUSH_BEFORE="${PUSH_HEAD}^"
            fi
            RANGE="$PUSH_BEFORE...$PUSH_HEAD"
          fi
          echo "Checking range: $RANGE"
          node dist/cli/index.js check --diff "$RANGE"
